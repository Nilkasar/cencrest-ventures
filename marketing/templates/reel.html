<!doctype html>
<!-- reel.html — 1080×1920 vertical reel, 24 s on a 100 BPM grid (beat .6 s, bar 2.4 s), matches audio/example_futurepop.py
     hook 0–2.4 · chapters 2.4 / 8.4 / 14.4 (FEATURES[1..3]) · outro 20.4–24
     events per chapter (all on the grid): phone rises +0 · tap +1.8 · ring +1.8–3.6 · toast +3.6 · exit last .3 s
     node tools/render.cjs stills templates/reel.html out/stills 1.2,3,4.5,6.3,8.3,9,15,21.5   (check!)
     node tools/render.cjs frames templates/reel.html out/frames -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="brand.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0E0B14}
#p{position:absolute;inset:0;overflow:hidden}
.a{position:absolute}.J{font-weight:800;letter-spacing:-.045em;line-height:1}.I{font-weight:700}
</style></head>
<body><div id="p"></div>
<script>
const Bd = BRAND; document.querySelectorAll('style')[0].textContent += `.J{font-family:'${Bd.fontDisplay}'}.I{font-family:'${Bd.fontUI}'}`;
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), p = (t, a, d) => cl((t - a) / d), lerp = (a, b, k) => a + (b - a) * k;
const eo = (x) => 1 - Math.pow(1 - x, 3), eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;   // NO bounce eases
const DUR = 24, CH = [2.4, 8.4, 14.4], LEN = 6, F = FEATURES.slice(1, 4);
// phone = hero: frame 800 wide → screen shows ~88 % of frame height; bottom may crop (allowed)
const PW = 840, BZ = 16, S = (PW - 2 * BZ) / 780, PX = (1080 - PW) / 2, PY = 270;   // visible phone ≈ 86 % of frame height
const G = `linear-gradient(90deg,${Bd.grad.join(',')})`;

window.render = (t) => {
  let h = `<div class="a" style="inset:0;background:radial-gradient(1200px 900px at 50% 70%,#2A1240,${Bd.dark} 70%)"></div>`;
  // hook
  if (t < 2.4) { const k1 = eo(p(t, .1, .4)), k2 = eo(p(t, .7, .4)), out = 1 - p(t, 2.1, .3);
    h += `<div class="a" style="left:80px;right:80px;top:640px;opacity:${out}">
      <div class="J" style="font-size:150px;color:#fff;opacity:${k1};transform:translateY(${(1 - k1) * 40}px)">3 things</div>
      <div class="J" style="font-size:150px;opacity:${k2};transform:translateY(${(1 - k2) * 40}px);background:${G};-webkit-background-clip:text;color:transparent">${Bd.name} does</div>
      <div class="J" style="font-size:150px;color:#fff;opacity:${eo(p(t, 1.3, .4))}">for you.</div></div>`; }
  // chapters
  CH.forEach((a, i) => { if (t < a || t >= a + LEN || !F[i]) return; const f = F[i], st = t - a;
    const inK = eo(p(st, 0, .45)), outK = eio(p(st, LEN - .3, .3));
    const y = PY + (1 - inK) * 900 + outK * 900, scroll = lerp(f.sy, f.sy + 160, eio(p(st, 2.2, 3.2)));
    // caption band
    h += `<div class="a" style="left:70px;right:70px;top:${lerp(90, 66, inK)}px;opacity:${inK * (1 - outK)}">
      <div style="display:flex;align-items:center;gap:18px"><span class="J" style="font-size:54px;color:${f.bg}">0${i + 1}</span>
      ${f.plan ? `<span class="I" style="font-size:24px;font-weight:900;letter-spacing:.14em;padding:6px 16px;border-radius:18px;${f.plan === 'PREMIUM' ? 'background:linear-gradient(90deg,#FFD27A,#FF9F1C);color:#16131f' : 'background:#16A34A;color:#fff'}">${f.plan}</span>` : ''}</div>
      <div class="J" style="font-size:68px;color:#fff;margin-top:10px">${f.title.replace(/<br>/g, ' ')}</div></div>`;
    // phone with real screen
    h += `<div class="a" style="left:${PX}px;top:${y}px;width:${PW}px;height:1800px;border-radius:104px;background:#16131f;padding:${BZ}px;box-shadow:0 60px 120px rgba(0,0,0,.5),inset 0 0 0 3px #3a3446">
      <div style="position:relative;width:100%;height:100%;border-radius:88px;overflow:hidden;background:${Bd.cream}"><img src="../shots/${f.screen}_screen.png" style="position:absolute;left:0;top:0;width:780px;transform-origin:0 0;transform:scale(${S}) translateY(${-scroll}px)"></div></div>`;
    // tap + ring on the key number
    const [tx, ty] = f.target, gx = PX + BZ + tx * S, gy = y + BZ + (ty - scroll) * S;
    if (st >= 1.8 && st < 2.3) { const k = p(st, 1.8, .5); h += `<div class="a" style="left:${gx - 50 - k * 40}px;top:${gy - 50 - k * 40}px;width:${100 + k * 80}px;height:${100 + k * 80}px;border-radius:50%;border:6px solid #fff;opacity:${1 - k}"></div>`; }
    if (st >= 1.8 && st < 3.9) { const k = eo(p(st, 1.8, .3)) * (1 - p(st, 3.6, .3)); h += `<div class="a" style="left:${gx - 150}px;top:${gy - 70}px;width:300px;height:140px;border-radius:70px;border:7px solid #fff;opacity:${k};box-shadow:0 0 0 5px rgba(22,19,31,.55),0 0 40px rgba(255,255,255,.6)"></div>`; }
    // toast
    if (st >= 3.6 && st < 4.9) { const k = eo(p(st, 3.6, .3)) * (1 - p(st, 4.6, .3));
      h += `<div class="I a" style="left:50%;top:${lerp(1700, 1640, k)}px;transform:translateX(-50%);opacity:${k};background:#16131f;color:#fff;font-size:36px;padding:22px 40px;border-radius:50px;box-shadow:0 20px 40px rgba(0,0,0,.4);white-space:nowrap">✓ ${f.note.replace(/<br>/g, ' ')}</div>`; }
  });
  // outro
  if (t >= 20.4) { const k = eo(p(t, 20.4, .5)), k2 = eo(p(t, 21.6, .4));
    h += `<img class="a" src="${Bd.logo}" style="left:390px;top:${lerp(560, 520, k)}px;width:300px;height:300px;opacity:${k}">
      <div class="J a" style="left:0;right:0;top:900px;text-align:center;font-size:110px;color:#fff;opacity:${k}">${Bd.name}</div>
      <div class="I a" style="left:0;right:0;top:1060px;text-align:center;font-size:40px;color:#cfc8dc;opacity:${k2}">${Bd.status}</div>
      <div class="I a" style="left:0;right:0;top:1140px;text-align:center;font-size:30px;letter-spacing:.2em;color:${Bd.gold};opacity:${k2}">${Bd.url}</div>`; }
  document.getElementById('p').innerHTML = h;
};
window.ready = Promise.all([document.fonts.load(`800 40px "${Bd.fontDisplay}"`), document.fonts.load(`700 40px "${Bd.fontUI}"`), document.fonts.ready]).then(() => {
  const imgs = [Bd.logo, ...F.map((f) => `../shots/${f.screen}_screen.png`)].map((s) => { const i = new Image(); i.src = s; return i.decode().catch(() => 0); });
  return Promise.all(imgs); }).then(() => { window.render(0); return { dur: DUR, fps: 30 }; });
</script>
</body></html>
